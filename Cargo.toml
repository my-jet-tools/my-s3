[package]
name = "my-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# A TLS provider feature is not optional here: fl-url's `default = []` compiles the
# TLS code paths out entirely, and S3 is always addressed over `https://`. Without
# one every request dies at connect time with my-tls' "No rustls CryptoProvider is
# installed". `with-rust-tls` backs rustls with rustls-graviola - pure Rust, no C
# toolchain - at the cost of building ONLY on x86_64 and aarch64 (a hard
# `compile_error!` anywhere else). Swap to `with-ring-tls` if another architecture
# ever has to build this crate.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git", features = [
    "with-rust-tls",
] }
my-xml-reader = { tag = "0.1.1", git = "https://github.com/my-jet-tools/my-xml-reader" }

# `RequestBodyStream` lives here and `flurl` does not re-export it (only `hyper`,
# `my_tls` and `my_http_utils`). The tag MUST stay equal to the one `flurl` pins,
# otherwise the graph ends up with two `hyper::body::Body` traits and
# `put_request_streamed` stops accepting our body with a "trait not implemented" that
# looks like a library bug.
my-http-client = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-http-client.git" }
# `sync` for the mpsc channel a streamed body travels through (and the `Notify` that
# holds a `start_upload` request back until its first chunk), `rt` for the
# `tokio::spawn` that runs an `upload_with_writer` producer alongside the request and
# the task a `start_upload` runs its request on.
# Neither is optional: without `rt` the crate builds only when some other crate in the
# graph happens to turn it on.
tokio = { version = "*", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "*", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
